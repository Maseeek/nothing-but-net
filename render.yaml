services:
  # Node.js Auth Server
  - type: web
    name: nbnc-auth-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # User will input this in dashboard
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Python Video Analysis Server
  - type: web
    name: nbnc-analysis-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.server.server:app
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9.0
